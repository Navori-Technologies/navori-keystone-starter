name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Follows packageManager in package.json — bun.lock was generated by this
  # exact version, and running CI with another validates a dependency tree
  # that isn't the one committed.
  BUN_VERSION: '1.4.2'
  # Matches .node-version / engines.node / the Dockerfiles' `node:24-alpine` —
  # not the version the runner happens to ship.
  NODE_VERSION: '24'
  # `keystone build` needs these to parse the config, but never connects to
  # the database — dummies are enough. No Postgres service required here.
  DATABASE_URL: postgresql://ci:ci@localhost/ci
  SESSION_SECRET: ci-session-secret-minimum-32-characters-long

jobs:
  # Cheap, no build required: semgrep reads source directly and jscpd runs via
  # bunx. Scoped to NEW findings vs. the base commit — a full-repo scan would
  # fail on whatever pre-existing debt is already there, which makes the gate
  # useless the day it's turned on.
  static-analysis:
    name: Static analysis (semgrep + jscpd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so semgrep can diff against the base commit.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Python for semgrep
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install semgrep
        run: pip install semgrep

      # Only findings NEW vs. the base commit. A workflow_dispatch run has
      # neither pull_request.base.sha nor event.before, so fall back to the
      # merge-base with main (what a PR would have used).
      - name: Semgrep scan (new findings vs base)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin main >/dev/null 2>&1 || true
            BASE="$(git merge-base origin/main HEAD 2>/dev/null || true)"
            echo "workflow_dispatch: using merge-base with main -> ${BASE:-<none>}"
          fi
          if [ -n "$BASE" ]; then
            semgrep scan --config=p/default --error --metrics=off --baseline-commit "$BASE"
          else
            semgrep scan --config=p/default --error --metrics=off
          fi

      - name: jscpd (duplication check)
        run: bunx jscpd --min-tokens 100 --min-lines 10 --mode strict --threshold 5 --reporters console --ignore "**/node_modules/**,**/generated/**,**/.keystone/**,**/coverage/**,**/tests/**" .

  quality:
    name: Quality gates (lint, format, typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # tsc/prisma/keystone run under node, not bun — see keystone.ts's dev
      # log and Dockerfile's builder stage for why. A runner-provided Node
      # would validate against a runtime that isn't the one in production.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generates schema.prisma/schema.graphql, the Prisma client, and
      # generated/keystone/types.ts (which schema.ts imports) — all in one
      # step. `prisma generate` on its own fails on a checkout with no
      # committed schema.prisma yet: this is what produces it first.
      - name: Generate Prisma client and Keystone types
        run: bunx keystone build --no-ui

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bunx tsc --noEmit
